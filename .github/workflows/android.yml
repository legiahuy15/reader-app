name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout mã nguồn sử dụng phiên bản action mới nhất
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Java chuẩn để dịch Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cài đặt các công cụ biên dịch và giải nén hệ thống Linux
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3 python3-dev python3-pip zip unzip libffi-dev libssl-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386 autoconf automake libtool

      # 4. Cài đặt các thư viện Python theo đúng phiên bản ổn định
      - name: Install Python Tools
        run: |
          pip3 install --upgrade "Cython<3.0.0" "virtualenv<20.10.0" buildozer python-for-android

      # 5. CHIÊU QUYẾT ĐỊNH: Ép tự động ký chấp nhận tất cả Android SDK Licenses ngầm
      - name: Auto Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android licenses || true

      # 6. Ra lệnh đóng gói (Cấp quyền chạy root độc lập để chặn đứng exit code 100)
      - name: Build with Buildozer
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"
        run: |
          buildozer -v android debug

      # 7. Đóng gói thành phẩm APK đẩy lên mục download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Reader-APK
          path: bin/*.apk
