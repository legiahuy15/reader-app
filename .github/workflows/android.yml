name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Sử dụng Action phiên bản mới để tương thích Node.js đời cao
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Cài đặt cưỡng bức các công cụ giải nén cốt lõi chống kẹt luồng SDK
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3 python3-dev python3-pip zip unzip libffi-dev libssl-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386 Autoconf automake libtool

      # 3. Đồng bộ bộ đôi Cython và virtualenv chuẩn hệ thống Python 3 của máy chủ
      - name: Install Python Tools
        run: |
          pip3 install --upgrade "Cython<3.0.0" "virtualenv<20.10.0" buildozer python-for-android

      # 4. Ép chấp nhận bản quyền Android SDK trực tiếp thông qua luồng chạy lệnh Linux
      - name: Auto Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android licenses || true

      # 5. Kích hoạt đóng gói tối thượng (Bổ sung biến môi trường chặn đứng hoàn toàn Exit code 100)
      - name: Build with Buildozer
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: "1"
          BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT: "1"
        run: |
          buildozer -v android debug

      # 6. Xuất bản và đóng gói file APK sạch lỗi về kho lưu trữ
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Reader-APK
          path: bin/*.apk
