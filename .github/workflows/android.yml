name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04 # Sử dụng bản Ubuntu ổn định nhất để tránh lỗi Java

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git python3 python3-dev python3-pip zip unzip libffi-dev libssl-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386

      - name: Install Python Tools
        run: |
          pip3 install --upgrade "Cython<3.0.0" "virtualenv<20.10.0" buildozer python-for-android

      - name: Build with Buildozer
        env:
          BUILDOZER_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Reader-APK
          path: bin/*.apk
